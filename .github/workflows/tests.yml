name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # No ANTHROPIC_API_KEY is set: the suite must pass offline using FakeLLM.
      - run: uv run --locked pytest
