[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-control-console"
version = "0.1.0"
description = "Go/No-Go launch console: anomaly reports, launch-limit verdicts, and Flight Director briefings."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    # Real model client. Tests never call it: they use FakeLLM (see tests/conftest.py).
    "anthropic>=2.8",
    "python-dotenv>=1.0",
]

# uv installs the "dev" group by default on `uv run`, so tests need no extra flags.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
